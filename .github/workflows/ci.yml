name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Build warehouse
        run: python data-engineering/run_pipeline.py
      - name: Pytest
        env:
          PYTHONPATH: .
          NEXUS_API_KEY: dev-nexus-key
        run: pytest -q
